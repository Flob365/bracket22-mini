[project]
name = "bracket22-mini"
version = "0.1.0"
description = "Deterministic research desk and human-reviewed paper portfolio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "polars>=1.20,<2",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.6,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "yfinance>=0.2.65,<1",
    "exchange-calendars>=4.11,<5",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["bracket22"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
