# Deployment creates paid resources. Review the Render quote before applying.
services:
  - type: web
    name: bracket22-mini
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    healthCheckPath: /health
    dockerCommand: uvicorn bracket22.app:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bracket22-db
          property: connectionString
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: AGENT_MODE
        value: llm
      - key: BRACKET22_REQUIRE_AUTH
        value: "true"
      - key: BRACKET22_API_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
  - type: cron
    name: bracket22-daily
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    schedule: "0 7-23 * * *"
    dockerCommand: python -m bracket22.run_scheduled
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bracket22-db
          property: connectionString
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: AGENT_MODE
        value: llm
      - key: OPENAI_API_KEY
        sync: false
databases:
  - name: bracket22-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: bracket22
    user: bracket22
    ipAllowList: []
