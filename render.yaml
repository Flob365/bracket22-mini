# Free web service. Supply a free external PostgreSQL URL (for example Neon).
# No paid database or cron resources are created.
services:
  - type: web
    name: bracket22-mini
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /health
    dockerCommand: uvicorn bracket22.app:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: AGENT_MODE
        value: llm
      - key: BRACKET22_REQUIRE_AUTH
        value: "true"
      - key: BRACKET22_API_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
